<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="How a fix gets made: 1 spot a bug in a popular AI tool, 2 prove it with a test that fails, 3 fix it and watch the test pass, 4 the maintainers merge it so every user gets the fix.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;text-anchor:middle}
    .line{stroke:#d1d9e0}.flow{stroke:#0969da}.dot{fill:#0969da}.h{fill:#1f2328}.s{fill:#59636e}
    .node{fill:#f6f8fa;stroke:#0969da}.num{fill:#0969da}
    @media (prefers-color-scheme:dark){.line{stroke:#3d444d}.flow{stroke:#4493f8}.dot{fill:#4493f8}.h{fill:#f0f6fc}.s{fill:#9198a1}.node{fill:#151b23;stroke:#4493f8}.num{fill:#4493f8}}
    .flow{stroke-dasharray:6 10;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}
    .node{animation:lit 6s ease-in-out infinite}
    @keyframes lit{0%,100%{stroke-width:2}3%,22%{stroke-width:7}32%{stroke-width:2}}
  </style>
  <line class="line" x1="112" y1="60" x2="788" y2="60" stroke-width="4" stroke-linecap="round"/>
  <line class="flow" x1="112" y1="60" x2="788" y2="60" stroke-width="4" stroke-linecap="round"/>
  <circle class="dot" r="7"><animateMotion dur="6s" repeatCount="indefinite" path="M112,60 L788,60" keyTimes="0;0.9;1" keyPoints="0;1;1" calcMode="linear"/></circle>
  <circle class="node" style="animation-delay:-0.2s" cx="112" cy="60" r="32" stroke-width="2"/><text class="num" x="112" y="69" font-size="24" font-weight="700">1</text>
  <text class="h" x="112" y="128" font-size="18" font-weight="600">Spot a bug</text><text class="s" x="112" y="152" font-size="14">in a popular AI tool</text>
  <circle class="node" style="animation-delay:1.6s" cx="337" cy="60" r="32" stroke-width="2"/><text class="num" x="337" y="69" font-size="24" font-weight="700">2</text>
  <text class="h" x="337" y="128" font-size="18" font-weight="600">Prove it</text><text class="s" x="337" y="152" font-size="14">with a test that fails</text>
  <circle class="node" style="animation-delay:3.4s" cx="563" cy="60" r="32" stroke-width="2"/><text class="num" x="563" y="69" font-size="24" font-weight="700">3</text>
  <text class="h" x="563" y="128" font-size="18" font-weight="600">Fix it</text><text class="s" x="563" y="152" font-size="14">and watch the test pass</text>
  <circle class="node" style="animation-delay:5.2s" cx="788" cy="60" r="32" stroke-width="2"/><text class="num" x="788" y="69" font-size="24" font-weight="700">4</text>
  <text class="h" x="788" y="128" font-size="18" font-weight="600">It ships</text><text class="s" x="788" y="152" font-size="14">the maintainers merge it,</text><text class="s" x="788" y="172" font-size="14">so every user gets the fix</text>
</svg>
