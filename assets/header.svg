<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Hi, I'm Abdullah. I find bugs in AI tools that companies rely on, and fix them. Open to remote AI Product Engineer roles.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .t{fill:#1f2328}.m{fill:#59636e}.a{fill:#0969da}.g{fill:#1a7f37}.pill{fill:#dafbe1;stroke:#4ac26b}
    @media (prefers-color-scheme:dark){.t{fill:#f0f6fc}.m{fill:#9198a1}.a{fill:#4493f8}.g{fill:#3fb950}.pill{fill:#0f2a17;stroke:#2ea043}}
    .up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:3.5s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .typed{clip-path:inset(0 100% 0 0);animation:type 2.4s steps(60,end) .9s forwards}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    .mv{animation:mv 2.4s steps(60,end) .9s forwards}
    @keyframes mv{to{transform:translateX(746px)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  </style>
  <g class="up d1">
    <rect class="pill" x="20" y="14" width="372" height="34" rx="17" stroke-width="1"/>
    <circle class="g ring" cx="42" cy="31" r="5"/>
    <circle class="g" cx="42" cy="31" r="5"/>
    <text class="g" x="58" y="36.5" font-size="15" font-weight="600">Open to remote AI Product Engineer roles</text>
  </g>
  <text class="t up d2" x="20" y="108" font-size="54" font-weight="700">Hi, I'm Abdullah</text>
  <text class="a typed" x="20" y="152" font-size="26" font-weight="600" textLength="740" lengthAdjust="spacingAndGlyphs">I find bugs in AI tools that companies rely on, and fix them.</text>
  <g class="mv"><rect class="a caret" x="20" y="128" width="3" height="32"/></g>
  <text class="m up d3" x="20" y="192" font-size="17">Fintech operations background · now building voice and AI products end to end</text>
</svg>
